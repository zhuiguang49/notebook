{% extends "base.html" %}

{% block content %}
  {{ super() }}

  <hr>
  <h2>评论</h2>
  <script src="https://giscus.app/client.js"
          data-repo="zhuiguang49/notebook"  data-repo-id="R_kgDOPDL8OA"   data-category="General"
          data-category-id="DIC_kwDOPDL8OM4CsJQk"  data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="preferred_color_scheme"  data-lang="zh-CN"
          crossorigin="anonymous"
          async>
  </script>
  <noscript>Please enable JavaScript to view the comments.</noscript>
{% endblock %}

{% block footer %}
  {{ super() }} 

  <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
{% endblock %}

{% block copyright %}
  {% if config.copyright %}
    <div class="md-footer-copyright__highlight">
      {{ config.copyright }}
    </div>
  {% endif %}

  <div style="text-align: center; color: var(--md-meta-color); font-size: 0.7rem; padding: 0.5rem;">
      <span id="busuanzi_container_site_pv" style="display:inline-block; margin-right: 15px;">
          本站总访问量 <span id="busuanzi_value_site_pv"></span> 次
      </span>
      <span id="busuanzi_container_page_pv" style="display:inline-block;">
          本文总阅读量 <span id="busuanzi_value_page_pv"></span> 次
      </span>
  </div>

  {{ super() }}
{% endblock %}
